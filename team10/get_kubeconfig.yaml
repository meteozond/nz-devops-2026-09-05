- name: Fetch kubeconfig into ~/.kube/config
  hosts: masters
  gather_facts: false
  tasks:
    - name: Ensure ~/.kube exists on the controller
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Fetch rke2.yaml from the master
      run_once: true
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        flat: true

    - name: Point kubeconfig at the master FQDN
      delegate_to: localhost
      run_once: true
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        regexp: 'https://(127\.0\.0\.1|[0-9.]+):6443'
        replace: "https://{{ groups['masters'][0] }}:6443"
